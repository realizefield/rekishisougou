<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="38" font-size="24" font-weight="bold" fill="#222">世界恐慌の広がり</text>
<text x="40" y="62" font-size="14" fill="#555">アメリカの株価暴落が、どのように世界と日本に広がったかを、順番に見ましょう。</text>
<rect x="40" y="110" width="240" height="110" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="160.0" y="148.6" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">1929年10月</text>
<text x="160.0" y="170.6" font-size="16" text-anchor="middle" fill="#222">ニューヨークで</text>
<text x="160.0" y="192.6" font-size="16" text-anchor="middle" fill="#222">株価が大暴落</text>
<line x1="284" y1="165" x2="326" y2="165" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="330" y="110" width="240" height="110" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="450.0" y="148.6" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">アメリカ国内で</text>
<text x="450.0" y="170.6" font-size="16" text-anchor="middle" fill="#222">銀行・工場がつぶれ、</text>
<text x="450.0" y="192.6" font-size="16" text-anchor="middle" fill="#222">失業者がふえる</text>
<line x1="574" y1="165" x2="616" y2="165" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="620" y="110" width="240" height="110" rx="10" fill="#fff" stroke="#c26a00" stroke-width="2"/>
<text x="740.0" y="148.6" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">アメリカが海外から</text>
<text x="740.0" y="170.6" font-size="16" text-anchor="middle" fill="#222">資金を引き上げ、</text>
<text x="740.0" y="192.6" font-size="16" text-anchor="middle" fill="#222">輸入を減らす</text>
<line x1="864" y1="165" x2="906" y2="165" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="910" y="110" width="240" height="110" rx="10" fill="#fff" stroke="#c26a00" stroke-width="2"/>
<text x="1030.0" y="148.6" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">ヨーロッパ・アジアへ</text>
<text x="1030.0" y="170.6" font-size="16" text-anchor="middle" fill="#222">不況が広がる</text>
<text x="1030.0" y="192.6" font-size="16" text-anchor="middle" fill="#222">（世界恐慌）</text>
<line x1="1030" y1="224" x2="1030" y2="288" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="900" y="290" width="260" height="100" rx="10" fill="#e9f5ea" stroke="#2e7d32" stroke-width="2"/>
<text x="1030.0" y="324.25" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">日本（昭和恐慌）</text>
<text x="1030.0" y="345.25" font-size="15" text-anchor="middle" fill="#222">生糸の輸出が減り、</text>
<text x="1030.0" y="366.25" font-size="15" text-anchor="middle" fill="#222">米の値段も下がる</text>
<text x="40" y="330" font-size="18" text-anchor="start" fill="#222" font-weight="bold">各国の対応のちがい</text>
<line x1="40" y1="340" x2="860" y2="340" stroke="#999" stroke-dasharray="4 4"/>
<rect x="40" y="360" width="195" height="130" rx="10" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
<text x="137.5" y="409.9" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">アメリカ</text>
<text x="137.5" y="429.9" font-size="14" text-anchor="middle" fill="#222">ニューディール</text>
<text x="137.5" y="449.9" font-size="14" text-anchor="middle" fill="#222">政府が仕事をつくる</text>
<rect x="250" y="360" width="195" height="130" rx="10" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
<text x="347.5" y="409.9" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">イギリス・フランス</text>
<text x="347.5" y="429.9" font-size="14" text-anchor="middle" fill="#222">ブロック経済</text>
<text x="347.5" y="449.9" font-size="14" text-anchor="middle" fill="#222">植民地と結んで守る</text>
<rect x="460" y="360" width="195" height="130" rx="10" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
<text x="557.5" y="409.9" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">ソ連</text>
<text x="557.5" y="429.9" font-size="14" text-anchor="middle" fill="#222">計画経済</text>
<text x="557.5" y="449.9" font-size="14" text-anchor="middle" fill="#222">恐慌の影響を受けにくかった</text>
<rect x="670" y="360" width="195" height="130" rx="10" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
<text x="767.5" y="409.9" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">ドイツ・イタリア</text>
<text x="767.5" y="429.9" font-size="14" text-anchor="middle" fill="#222">ファシズム</text>
<text x="767.5" y="449.9" font-size="14" text-anchor="middle" fill="#222">独裁で国内をまとめる</text>
<line x1="450" y1="500" x2="450" y2="540" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="250" y="545" width="620" height="50" rx="10" fill="#f3f3f3" stroke="#999" stroke-width="2"/>
<text x="560.0" y="575.25" font-size="15" text-anchor="middle" fill="#222">対応のちがいが、国どうしの対立を深め、第二次世界大戦へつながっていきます</text>
</svg>