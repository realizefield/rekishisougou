<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#222">歴史総合の全体像　3つの柱</text>
<text x="40" y="66" font-size="14" fill="#555">世界の歴史と日本の歴史を、ひとつの流れとして学びます。</text>
<rect x="40" y="100" width="340" height="380" rx="12" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
<rect x="40" y="100" width="340" height="64" rx="12" fill="#2b5fa8"/>
<rect x="40" y="140" width="340" height="24" fill="#2b5fa8"/>
<text x="210.0" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">近代化</text>
<text x="210.0" y="154" font-size="14" text-anchor="middle" fill="#fff">18世紀〜19世紀</text>
<circle cx="68" cy="195" r="5" fill="#2b5fa8"/>
<text x="84" y="200" font-size="17" fill="#222">産業革命・市民革命</text>
<circle cx="68" cy="241" r="5" fill="#2b5fa8"/>
<text x="84" y="246" font-size="17" fill="#222">国民国家のたんじょう</text>
<circle cx="68" cy="287" r="5" fill="#2b5fa8"/>
<text x="84" y="292" font-size="17" fill="#222">開国と明治維新</text>
<circle cx="68" cy="333" r="5" fill="#2b5fa8"/>
<text x="84" y="338" font-size="17" fill="#222">帝国主義と日清・日露戦争</text>
<line x1="60" y1="390" x2="360" y2="390" stroke="#2b5fa8" stroke-dasharray="4 4"/>
<text x="60" y="416" font-size="13" font-weight="bold" fill="#2b5fa8">中学歴史（j-rekishi4）の対応単元</text>
<text x="60" y="440" font-size="14" fill="#333">ch15・ch16・kindai10</text>
<text x="60" y="460" font-size="14" fill="#333">ch17〜ch20</text>
<line x1="386" y1="290" x2="424" y2="290" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="430" y="100" width="340" height="380" rx="12" fill="#fdf0e0" stroke="#c26a00" stroke-width="2"/>
<rect x="430" y="100" width="340" height="64" rx="12" fill="#c26a00"/>
<rect x="430" y="140" width="340" height="24" fill="#c26a00"/>
<text x="600.0" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">大衆化</text>
<text x="600.0" y="154" font-size="14" text-anchor="middle" fill="#fff">20世紀前半</text>
<circle cx="458" cy="195" r="5" fill="#c26a00"/>
<text x="474" y="200" font-size="17" fill="#222">第一次世界大戦</text>
<circle cx="458" cy="241" r="5" fill="#c26a00"/>
<text x="474" y="246" font-size="17" fill="#222">民主主義と大衆文化</text>
<circle cx="458" cy="287" r="5" fill="#c26a00"/>
<text x="474" y="292" font-size="17" fill="#222">世界恐慌とファシズム</text>
<circle cx="458" cy="333" r="5" fill="#c26a00"/>
<text x="474" y="338" font-size="17" fill="#222">第二次世界大戦</text>
<line x1="450" y1="390" x2="750" y2="390" stroke="#c26a00" stroke-dasharray="4 4"/>
<text x="450" y="416" font-size="13" font-weight="bold" fill="#c26a00">中学歴史（j-rekishi4）の対応単元</text>
<text x="450" y="440" font-size="14" fill="#333">rekishi21〜rekishi24</text>
<line x1="776" y1="290" x2="814" y2="290" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
<rect x="820" y="100" width="340" height="380" rx="12" fill="#e9f5ea" stroke="#2e7d32" stroke-width="2"/>
<rect x="820" y="100" width="340" height="64" rx="12" fill="#2e7d32"/>
<rect x="820" y="140" width="340" height="24" fill="#2e7d32"/>
<text x="990.0" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">グローバル化</text>
<text x="990.0" y="154" font-size="14" text-anchor="middle" fill="#fff">20世紀後半〜現代</text>
<circle cx="848" cy="195" r="5" fill="#2e7d32"/>
<text x="864" y="200" font-size="17" fill="#222">冷戦とアジア・アフリカの独立</text>
<circle cx="848" cy="241" r="5" fill="#2e7d32"/>
<text x="864" y="246" font-size="17" fill="#222">日本の戦後改革・高度経済成長</text>
<circle cx="848" cy="287" r="5" fill="#2e7d32"/>
<text x="864" y="292" font-size="17" fill="#222">冷戦の終結</text>
<circle cx="848" cy="333" r="5" fill="#2e7d32"/>
<text x="864" y="338" font-size="17" fill="#222">現代の世界と日本</text>
<line x1="840" y1="390" x2="1140" y2="390" stroke="#2e7d32" stroke-dasharray="4 4"/>
<text x="840" y="416" font-size="13" font-weight="bold" fill="#2e7d32">中学歴史（j-rekishi4）の対応単元</text>
<text x="840" y="440" font-size="14" fill="#333">rekishi25・rekishi26</text>
<rect x="40" y="500" width="1120" height="52" rx="10" fill="#f3f3f3" stroke="#999"/>
<text x="600" y="532" font-size="17" font-weight="bold" text-anchor="middle" fill="#333">現代的な諸課題　（過去の学びを、いまの世界と私たちの暮らしにつなげる）</text>
<rect x="40" y="570" width="1120" height="52" rx="10" fill="#fff8d6" stroke="#d9b800"/>
<text x="60" y="593" font-size="14" font-weight="bold" fill="#7a5d00">学び方のポイント</text>
<text x="190" y="593" font-size="14" fill="#333">どの時代でも「日本・アジア・欧米」を同時に見て、写真・グラフ・風刺画などの資料から読み取ります。</text>
<text x="190" y="612" font-size="14" fill="#333">近代化は「世界が結びつく」、大衆化は「多くの人が社会に参加する」、グローバル化は「世界が一体になる」流れです。</text>
</svg>