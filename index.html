  .badge-done{background:#27ae60;color:#fff}
  .badge-test{background:#e67e22;color:#fff}
  .unit-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn-s{padding:7px 14px;border-radius:7px;border:none;font-size:13px;font-weight:bold;cursor:pointer;transition:0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px}

  .btn-study:hover{background:#1e2d6b}
  .btn-quiz{background:#27ae60;color:#fff}
  .btn-quiz:hover{background:#1e8a4d}

  try{return JSON.parse(localStorage.getItem('gamba_progress')||'{}');}catch(e){return {};}
}

function renderUnits(){
  const prog = getProgress();
  const container = document.getElementById('unit-list');
  container.innerHTML = '';
  let done = 0;

  UNITS.forEach(unit => {
    const p = prog[unit.id] || {};
    const studyDone = !!p.studyDone;
    const testScore = p.testScore;
    const pass = testScore !== undefined && testScore >= 70;
    if(studyDone) done++;

    const block = document.createElement('div');
    block.className = 'era-block';

    if(unit.comingSoon){
      block.innerHTML = `
        <div class="era-title" style="background:#aaa">
          <span class="era-icon">${unit.icon}</span>${unit.era}
        </div>
        <div class="unit-grid">
          <div class="unit-card" style="opacity:0.55;background:#f5f5f5;border-color:#ccc;">
            <div class="unit-top">
              <div class="unit-number" style="opacity:0.3">${unit.num}</div>
              <div class="unit-info">
                <div class="unit-title" style="color:#888">${unit.title}</div>
                <div class="unit-sub">${unit.sub}</div>
                <div style="margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:#e8e8e8;border-radius:20px;padding:6px 16px;color:#888;font-size:14px;font-weight:bold;">
                  🔒 近日公開
                </div>
              </div>
            </div>
          </div>
        </div>`;
    } else {
      block.innerHTML = `
        <div class="era-title" style="background:${unit.color}">
          <span class="era-icon">${unit.icon}</span>${unit.era}
        </div>
        <div class="unit-grid">
          <div class="unit-card${studyDone?' done':''}${pass?' test-pass':''}">
            <div class="unit-top">
              <div class="unit-number">${unit.num}</div>
              <div class="unit-info">
                <div class="badge-area">
                  ${studyDone?'<span class="badge badge-done">✓ 学習完了</span>':''}
                  ${testScore!==undefined?`<span class="badge badge-test">テスト ${testScore}点</span>`:''}
                </div>
                <div class="unit-title">${unit.title}</div>
                <div class="unit-sub">${unit.sub}</div>
                <div class="unit-keywords">${unit.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
                <div class="unit-actions">
                  <a class="btn-s btn-study" href="${unit.study}">📖 学習する</a>
                  <a class="btn-s btn-quiz" href="${unit.quiz}">✏️ 確認問題</a>
                  <a class="btn-s btn-test" href="${unit.test}">🎯 テスト</a>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }
    container.appendChild(block);
  });

  const pct = Math.round(done / UNITS.length * 100);
  document.getElementById('progress-text').textContent = `${done} / ${UNITS.length} 単元完了`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

renderUnits();
window.addEventListener('focus', renderUnits);
</script>
</body>
</html>
