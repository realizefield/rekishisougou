<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト：明治維新</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Meiryo",sans-serif;background:#f0f2f5;min-height:100vh;padding:20px 16px 80px}.back-btn{display:inline-flex;align-items:center;gap:6px;background:#2c3e8c;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:20px;text-decoration:none}h1{text-align:center;font-size:22px;color:#1a1a2e;margin-bottom:6px}.unit-label{text-align:center;color:#888;font-size:13px;margin-bottom:24px}.card{max-width:720px;margin:0 auto 20px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.07);border:1px solid #e5e8f0}.q-num{font-size:12px;color:#4a1a6b;font-weight:bold;margin-bottom:8px}.q-text{font-size:17px;color:#1a1a2e;line-height:1.7;margin-bottom:18px}.choices{display:flex;flex-direction:column;gap:10px}.choice{padding:12px 16px;border:2px solid #dde;border-radius:8px;cursor:pointer;font-size:15px;color:#333;transition:all 0.15s;background:#fafafa}.choice:hover{border-color:#4a1a6b;background:#f5eeff}.choice.selected{border-color:#4a1a6b;background:#e0c8f8;color:#2d0a40;font-weight:bold}.choice.correct{border-color:#27ae60;background:#e8fff2;color:#1e8a4d;font-weight:bold}.choice.wrong{border-color:#e74c3c;background:#fff0ef;color:#c0392b}.choice.show-correct{border-color:#27ae60;background:#e8fff2;color:#1e8a4d}.footer{max-width:720px;margin:0 auto;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{padding:12px 28px;border-radius:10px;border:none;font-size:16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:#4a1a6b;color:#fff;box-shadow:0 3px 0 #2d0a40}.btn-secondary{background:#6c757d;color:#fff;box-shadow:0 3px 0 #495057}#result-screen{display:none;max-width:720px;margin:0 auto;text-align:center}.result-card{background:#fff;border-radius:16px;padding:40px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}.result-score{font-size:72px;font-weight:bold;margin:10px 0}.result-score.pass{color:#4a1a6b}.result-score.fail{color:#e67e22}.result-msg{font-size:22px;font-weight:bold;margin-bottom:8px}.result-detail{font-size:15px;color:#888;margin-bottom:30px}.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;opacity:0;animation:fall linear forwards;border-radius:2px;pointer-events:none;z-index:9999}@keyframes fall{0%{top:-10px;opacity:1;transform:rotate(0deg)}100%{top:110vh;opacity:0.3;transform:rotate(720deg)}}</style>
</head>
<body>
<a class="back-btn" href="index.html">← 単元一覧に戻る</a>
<h1>🎯 テスト</h1>
<p class="unit-label">近代⑲ 明治維新</p>
<div id="quiz-screen">
  <div id="questions-area"></div>
  <div class="footer">
    <a class="btn btn-secondary" href="kindai19.html">📖 学習ページへ</a>
    <a class="btn btn-secondary" href="kindai19_quiz.html">✏️ 確認問題へ</a>
    <button class="btn btn-primary" onclick="submitTest()">採点する</button>
  </div>
</div>
<div id="result-screen">
  <div class="result-card">
    <div id="result-msg" class="result-msg"></div>
    <div id="result-score" class="result-score"></div>
    <div id="result-detail" class="result-detail"></div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="retryTest()">もう一度挑戦</button>
      <button class="btn btn-primary" onclick="location.href='index.html'">🏠 単元一覧へ</button>
    </div>
  </div>
</div>
<script>
const UNIT_ID="kindai19",PASS=70;
const questions=[
  {q:"1867年、15代将軍として大政奉還を行ったのは誰ですか？",choices:["徳川家茂","徳川斉昭","徳川慶福","徳川慶喜"],ans:3},
  {q:"1867年、岩倉具視・西郷隆盛らが宣言した天皇中心の新政府樹立の宣言を何といいますか？",choices:["大政奉還","王政復古の大号令","五箇条の御誓文","版籍奉還"],ans:1},
  {q:"戊辰戦争のきっかけとなった、旧幕府軍と新政府軍の最初の衝突を何といいますか？",choices:["桜田門外の変","薩英戦争","鳥羽伏見の戦い","会津戦争"],ans:2},
  {q:"明治政府が1868年に発布した政治方針で「広く会議をおこし万機公論に決すべし」を含む文書は何ですか？",choices:["五箇条の御誓文","五榜の掲示","廃藩置県令","版籍奉還令"],ans:0},
  {q:"1871年に行われた、藩を廃止して県を置く大改革を何といいますか？",choices:["版籍奉還","廃藩置県","四民平等","廃刀令"],ans:1},
  {q:"廃藩置県後の身分制度で武士に与えられた身分を何といいますか？",choices:["平民","士族","華族","武士族"],ans:1},
  {q:"明治政府の国家目標である「経済を豊かにして強い軍隊を作る」という方針を何といいますか？",choices:["殖産興業","富国強兵","文明開化","四民平等"],ans:1},
  {q:"1873年に土地の値段の3%を現金で納める税制改革を何といいますか？",choices:["版籍奉還","地租改正","殖産興業","廃刀令"],ans:1},
  {q:"1872年に群馬県に開設された官営模範工場を何といいますか？",choices:["大阪紡績会社","八幡製鉄所","富岡製糸工場","横須賀造船所"],ans:2},
  {q:"「学問ノススメ」を著し、慶應義塾大学を創設した啓蒙思想家は誰ですか？",choices:["中村正直","大隈重信","福沢諭吉","伊藤博文"],ans:2},
];
let userAnswers=new Array(questions.length).fill(-1);
function renderQuestions(){const area=document.getElementById("questions-area");area.innerHTML="";questions.forEach((q,qi)=>{const card=document.createElement("div");card.className="card";card.innerHTML=`<div class="q-num">問題 ${qi+1} / ${questions.length}</div><div class="q-text">${q.q}</div><div class="choices" id="ch-${qi}">${q.choices.map((c,ci)=>`<div class="choice" onclick="sel(${qi},${ci})"><span style="font-weight:bold;margin-right:8px">${["①","②","③","④"][ci]}</span>${c}</div>`).join("")}</div>`;area.appendChild(card);});}
function sel(qi,ci){userAnswers[qi]=ci;document.querySelectorAll(`#ch-${qi} .choice`).forEach((el,i)=>el.classList.toggle("selected",i===ci));}
function submitTest(){let correct=0;questions.forEach((q,qi)=>{const ua=userAnswers[qi];document.querySelectorAll(`#ch-${qi} .choice`).forEach((el,ci)=>{if(ci===q.ans)el.classList.add("show-correct");if(ua===ci&&ci!==q.ans)el.classList.add("wrong");if(ua===ci&&ci===q.ans){el.classList.add("correct");correct++;}el.onclick=null;});});const score=Math.round(correct/questions.length*100),pass=score>=PASS;try{const p=JSON.parse(localStorage.getItem("gamba_progress")||"{}");p[UNIT_ID]=p[UNIT_ID]||{};p[UNIT_ID].testScore=score;localStorage.setItem("gamba_progress",JSON.stringify(p));}catch(e){}document.getElementById("quiz-screen").style.display="none";const rs=document.getElementById("result-screen");rs.style.display="block";const se=document.getElementById("result-score");se.textContent=score+"点";se.className="result-score "+(pass?"pass":"fail");document.getElementById("result-msg").textContent=pass?"🎉 合格！":"😅 おしい！";document.getElementById("result-detail").textContent=`${correct} / ${questions.length} 問正解（合格ライン：${PASS}点）`;if(pass)confetti();window.scrollTo(0,0);}
function retryTest(){userAnswers=new Array(questions.length).fill(-1);document.getElementById("result-screen").style.display="none";document.getElementById("quiz-screen").style.display="block";renderQuestions();window.scrollTo(0,0);}
function confetti(){const col=["#f43f5e","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899"];for(let i=0;i<80;i++)setTimeout(()=>{const el=document.createElement("div");el.className="confetti-piece";el.style.left=Math.random()*100+"vw";el.style.background=col[Math.floor(Math.random()*col.length)];el.style.animationDuration=(1.5+Math.random()*2)+"s";el.style.width=(6+Math.random()*8)+"px";el.style.height=(6+Math.random()*8)+"px";document.body.appendChild(el);setTimeout(()=>el.remove(),4000);},i*30);}
renderQuestions();
</script>
<script src="https://realizefield.github.io/gamba-kounin-seito/gamba-ai.js" defer></script>
</body>
</html>
