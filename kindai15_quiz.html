<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>確認問題：東南アジアの植民地化</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Meiryo",sans-serif;background:#f0f2f5;min-height:100vh;padding:20px 16px 80px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:#2c3e8c;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:20px;text-decoration:none}
  h1{text-align:center;font-size:22px;color:#1a1a2e;margin-bottom:6px}
  .unit-label{text-align:center;color:#888;font-size:13px;margin-bottom:24px}
  .card{max-width:720px;margin:0 auto 20px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.07);border:1px solid #e5e8f0}
  .section-title{font-size:16px;font-weight:bold;color:#1a4a3a;border-left:4px solid #1a4a3a;padding-left:12px;margin-bottom:16px}
  .question-text{font-size:16px;line-height:2.8;color:#222}
  .blank{display:inline-block;min-width:90px;border-bottom:2px solid #1a4a3a;margin:0 4px;text-align:center;cursor:pointer;font-weight:bold;color:#1a4a3a;vertical-align:middle;min-height:26px;padding:0 4px}
  .blank.waiting{color:transparent;background:#eee;border-radius:4px}
  .blank.correct{background:#c0f0d0;color:#0d2d22;border-color:#1a4a3a}
  .blank.wrong{background:#ffe8e8;border-color:#e74c3c}
  .word-bank{border:1px solid #dde;border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;background:#efffea;margin-top:14px}
  .word-chip{padding:6px 13px;border-radius:20px;border:1.5px solid #aaa;background:#fff;cursor:pointer;font-size:14px;transition:0.15s}
  .word-chip:hover{border-color:#1a4a3a;background:#d0f0d8}
  .word-chip.selected{border-color:#1a4a3a;background:#90d0a0;font-weight:bold}
  .word-chip.used{opacity:0.3;pointer-events:none}
  .controls{max-width:720px;margin:0 auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:16px 0}
  .btn{padding:11px 24px;border-radius:10px;border:none;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:#1a4a3a;color:#fff;box-shadow:0 3px 0 #0d2d22}
  .btn-secondary{background:#6c757d;color:#fff;box-shadow:0 3px 0 #495057}
  .btn-orange{background:#e67e22;color:#fff;box-shadow:0 3px 0 #c96a10}
  .result-bar{max-width:720px;margin:0 auto 16px;background:#fff;border-radius:10px;padding:14px 20px;display:none;text-align:center;border:1px solid #dde;font-size:16px}
  .result-bar.pass{border-color:#1a4a3a;color:#1a4a3a;background:#d0f0d8}
  .result-bar.fail{border-color:#e74c3c;color:#e74c3c;background:#fff5f5}
</style>
</head>
<body>
<a class="back-btn" href="index.html">← 単元一覧に戻る</a>
<h1>✏️ 確認問題</h1>
<p class="unit-label">近代⑮ 19世紀のアジア②　東南アジアの植民地化</p>
<div id="result-bar" class="result-bar"></div>

<div class="card">
  <div class="section-title">🗺️ 植民地の支配国を答えよう</div>
  <div class="question-text">
    マレー半島は<span class="blank" data-ans="マレー連合州">マレー連合州</span>として<span class="blank" data-ans="イギリス">イギリス</span>が支配しました。インドネシアは<span class="blank" data-ans="オランダ">オランダ</span>が<span class="blank" data-ans="オランダ領東インド">オランダ領東インド</span>として支配しました。フィリピンは<span class="blank" data-ans="米西戦争">米西戦争</span>後に<span class="blank" data-ans="アメリカ">アメリカ</span>の支配下となり<span class="blank" data-ans="プランテーション">プランテーション</span>農業が行われました。
  </div>
  <div class="word-bank" id="bank0"></div>
</div>

<div class="card">
  <div class="section-title">🇻🇳 ベトナムとタイ</div>
  <div class="question-text">
    ベトナムは1884年の<span class="blank" data-ans="清仏戦争">清仏戦争</span>で宗主国の<span class="blank" data-ans="清（中国）">清（中国）</span>が敗れ、<span class="blank" data-ans="フランス領インドシナ">フランス領インドシナ</span>となりました。タイは国王<span class="blank" data-ans="ラーマ5世（チュラロンコン）">ラーマ5世（チュラロンコン）</span>の巧みな外交により、イギリスとフランスの間で<span class="blank" data-ans="緩衝国">緩衝国</span>として独立を保ちました。
  </div>
  <div class="word-bank" id="bank1"></div>
</div>

<div class="controls">
  <a class="btn btn-secondary" href="kindai15.html">📖 学習ページへ</a>
  <button class="btn btn-secondary" onclick="startChallenge()">🔄 リセット</button>
  <button class="btn btn-primary" onclick="checkAnswers()">採点する</button>
  <button class="btn btn-secondary" onclick="location.reload()">やり直す</button>
  <a class="btn btn-orange" href="kindai15_test.html">🎯 テストに挑戦 ▶</a>
</div>

<script>
const UNIT_ID='kindai15';let sel=null;
function startChallenge(){
  document.querySelectorAll('.blank').forEach(b=>{b.textContent='？';b.classList.add('waiting');b.classList.remove('correct','wrong');b.onclick=()=>fillBlank(b);});
  buildBank('bank0',['マレー連合州','イギリス','オランダ','オランダ領東インド','米西戦争','アメリカ','プランテーション']);
  buildBank('bank1',['清仏戦争','清（中国）','フランス領インドシナ','ラーマ5世（チュラロンコン）','緩衝国']);
}
function buildBank(id,words){const b=document.getElementById(id);b.innerHTML='';[...words].sort(()=>Math.random()-0.5).forEach(w=>{const c=document.createElement('div');c.className='word-chip';c.textContent=w;c.onclick=()=>{if(c.classList.contains('used'))return;document.querySelectorAll('.word-chip.selected').forEach(x=>x.classList.remove('selected'));sel=c;c.classList.add('selected');};b.appendChild(c);});}
function fillBlank(b){if(!sel)return;if(b.textContent!=='？'){const old=b.textContent;document.querySelectorAll('.word-chip').forEach(c=>{if(c.classList.contains('used')&&c.textContent===old)c.classList.remove('used');});}b.textContent=sel.textContent;b.classList.remove('waiting');sel.classList.add('used');sel.classList.remove('selected');sel=null;}
function checkAnswers(){let ok=0,total=0;document.querySelectorAll('.blank').forEach(b=>{total++;if(b.textContent===b.dataset.ans){b.classList.add('correct');b.classList.remove('wrong');ok++;}else{b.classList.remove('correct');b.classList.add('wrong');}b.onclick=null;b.style.cursor='default';});const bar=document.getElementById('result-bar');bar.style.display='block';if(ok===total){bar.className='result-bar pass';bar.textContent=`🎉 全問正解！(${ok}/${total}) テストにも挑戦しましょう！`;try{const p=JSON.parse(localStorage.getItem('gamba_progress')||'{}');p[UNIT_ID]=p[UNIT_ID]||{};p[UNIT_ID].quizDone=true;localStorage.setItem('gamba_progress',JSON.stringify(p));}catch(e){}}else{bar.className='result-bar fail';bar.textContent=`${ok}/${total} 正解。赤い空欄を確認しましょう！`;}window.scrollTo(0,0);}
startChallenge();
</script>
</body>
</html>
